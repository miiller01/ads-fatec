<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Faça o pré cadastro de Web Control:
                                    A conquista da Responsividade">
  <title>Pré Cadastro: Web Control: A conquista da repsonsividade</title>
  <link rel="icon" type="image/svg+xml" href="img/web-control-icone.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topo">
    <img class="logo" src="img/web-control-logo.svg" alt="Web Control: A conquista da responsividade" width="400"
      height="120">
    <p class="chamada"> O novo jogo on-line em que cada fase acontece em uma tela separada. Faça o pré-cadastro e
      garanta sua cópia antes do lançamento</p>
  </header>
  <main class="principal">
    <form class="formulario" action="#" method="post" aria-labelledby="titulo-formulario">
      <h1 class="titulo-formulario" id="titulo-formulario">Pré-cadastro</h1>
      <p class="instrucao">Campos marcados com <span class="obrigatorio" aria-hidden="true">*</span>
        são obrigatórios</p>
      <fieldset class="grupo">
        <legend class="grupo-titulo">Seus dados</legend>
        <div class="campos">
          <div class="campo campo-largo">
            <label for="nome">Nome Completo
              <span class="obrigatorio" aria-hidden="true">*</span>
            </label>
            <input type="text" id="nome" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="apelido">Apelido no jogo
              <span class="obrigatorio" aria-hidden="true">*</span>
            </label>
            <input type="text" id="apelido" name="apelido">
          </div>
      </fieldset>
    </form>
  </main>
  <footer class="rodape">
    <p>Web Control é um jogo fictício, criado para fins diáticos.</p>
  </footer>
</body>

</html>
